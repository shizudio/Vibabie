<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanctum Furni Pack — Shina Foo</title>
  <meta name="description" content="Sanctum Furni Pack — a 137-card furniture trading-card system and interactive pack-opening experience for the Sanctum app. Card design, packaging and web interaction by Shina Foo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500&family=EB+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="vinyl.css">
  <link rel="stylesheet" href="project.css">
</head>
<body>

  <div class="cursor default-cursor" id="cursor"></div>

  <!-- ── Spread topbar (scrolls away) ── -->
  <header class="project-topbar">
    <a href="about.html" class="nav-logo">Shina Foo</a>
    <div class="nav-links">
      <a href="work.html">Work</a>
      <a href="art.html">Art</a>
      <a href="contact.html">Contact</a>
      <a href="play.html">Play</a>
    </div>
  </header>

  <main class="project-page">

    <!-- ── LEFT: sticky nameplate ── -->
    <aside class="project-rail">
      <h1 class="project-title">
        <img class="project-logo" src="/work/sanctum/wordmark.png" alt="Sanctum App">
      </h1>
      <p class="project-meta">Interaction experiment &middot; 2026</p>
      <p class="project-desc">
        Built a mini game to test engagement: a 137-card furniture
        trading-card system, with pack packaging and a web pack-opening you
        can tear, tilt and swipe. Works on both desktop and mobile.
      </p>
      <div class="project-actions">
        <a class="project-cta" href="contact.html">Get in touch</a>
        <a class="project-visit" href="https://sanctum-pack-opening.vercel.app/" target="_blank" rel="noopener">Open a pack &#8599;</a>
      </div>
    </aside>

    <!-- ── RIGHT: the work ── -->
    <div class="project-stack">
      <figure class="stack-hero">
        <video src="/work/sanctum/pull.mp4" poster="/work/sanctum/pull-poster.webp"
               autoplay muted loop playsinline
               aria-label="Screen recording of a Furni Pack pull — the pack is torn open and cards are swiped through"></video>
      </figure>
      <figure><img src="/work/sanctum/p02.webp" alt="A torn-open pack revealing the first card — Book Boxes, Common, with its flavour text" loading="lazy" decoding="async"></figure>
      <figure><img src="/work/sanctum/p03.webp" alt="An Epic pull — Cosmos Patch, from the Blooming Garden set" loading="lazy" decoding="async"></figure>
      <figure><img src="/work/sanctum/p04.webp" alt="The rarity ladder — Common, Uncommon, Rare, Epic and Legendary, each with its own colour world" loading="lazy" decoding="async"></figure>

      <div class="project-foot">
        <a class="project-back" href="work.html">Work</a>
      </div>
    </div>

  </main>

  <script type="module" src="script.js"></script>
  <script type="module" src="vinyl-widget.js"></script>
</body>
</html>
