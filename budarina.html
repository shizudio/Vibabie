<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budarina — Destinations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#e9ddc4;
    --paper-2:#e3d5b8;
    --ink:#3a2f21;
    --ink-soft:#6d5f4b;
    --ink-faint:#8d7f68;
    --char:#4a3d2c;
    --dark:#26221c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
    user-select:none;
  }

  /* ---- paper texture ---- */
  #grain{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40;opacity:.55;mix-blend-mode:multiply}
  #linen{position:fixed;inset:0;pointer-events:none;z-index:1;
    background:
      repeating-linear-gradient(0deg, rgba(120,100,70,.035) 0 1px, transparent 1px 3px),
      repeating-linear-gradient(90deg, rgba(120,100,70,.03) 0 1px, transparent 1px 3px),
      radial-gradient(120% 90% at 50% 40%, rgba(255,248,230,.35), rgba(120,95,60,.14) 100%);
  }

  /* ---- nav ---- */
  nav{
    position:fixed;top:0;left:0;right:0;z-index:30;
    display:flex;align-items:center;gap:34px;
    padding:22px 46px;
    font-size:11.5px;letter-spacing:.04em;
  }
  #logo{font-weight:600;font-size:13px;letter-spacing:.02em;margin-right:14px}
  .navlink{color:var(--ink-faint);cursor:pointer;transition:color .25s;position:relative}
  .navlink:hover{color:var(--ink)}
  .navlink.on{color:var(--ink)}
  .navlink+.navlink::before{content:"·";position:absolute;left:-20px;color:var(--ink-faint)}
  #configure{
    margin-left:auto;
    background:var(--dark);color:#e9ddc4;
    font-family:'Playfair Display',serif;font-size:13.5px;
    padding:7px 18px 8px;cursor:pointer;border:none;
    box-shadow:2px 3px 8px rgba(60,45,25,.35);
    transition:transform .2s, box-shadow .2s;
  }
  #configure:hover{transform:translateY(-1px);box-shadow:3px 5px 12px rgba(60,45,25,.4)}

  /* ---- stage / strip ---- */
  #stage{position:fixed;inset:0;z-index:2;overflow:hidden}
  #strip{position:absolute;top:0;left:0;height:100%;will-change:transform;transform-origin:0 50%}
  .panel{position:absolute;top:0;height:100%;overflow:visible}
  .panel .roofwrap{position:absolute;will-change:transform;filter:drop-shadow(14px 26px 22px rgba(70,50,25,.28))}
  .panel svg.roof{display:block;width:100%;height:100%}
  .panel canvas{position:absolute;inset:0;width:100%;height:100%}
  .panel .lightshaft{
    position:absolute;pointer-events:none;
    background:linear-gradient(115deg, rgba(90,70,40,.10), rgba(90,70,40,.045) 45%, transparent 75%);
    transform:skewX(-24deg);
    filter:blur(6px);
  }
  #stage.overview .panel{cursor:pointer}

  /* ---- copy ---- */
  #copy{position:fixed;left:46px;bottom:9vh;z-index:20;max-width:340px;pointer-events:none}
  #kicker{font-size:11px;letter-spacing:.03em;color:var(--ink-soft);margin-bottom:26px;line-height:1.7}
  #kicker b{color:var(--ink);font-weight:600}
  #title{
    font-family:'Playfair Display',serif;font-weight:500;
    font-size:clamp(34px,3.6vw,52px);
    line-height:1.06;letter-spacing:-.01em;color:#241c10;
  }
  #title .w{display:inline-block;opacity:0;filter:blur(12px);transform:translateY(10px);
    transition:opacity .7s ease, filter .7s ease, transform .7s ease}
  #title .w.in{opacity:1;filter:blur(0);transform:none}
  #kicker.w{display:block}
  #kicker{opacity:0;filter:blur(8px);transition:opacity .6s ease, filter .6s ease}
  #kicker.in{opacity:1;filter:blur(0)}
  #desc{
    position:fixed;right:120px;bottom:9vh;z-index:20;
    width:250px;font-size:10.5px;line-height:1.75;color:var(--ink-soft);
    pointer-events:none;
    opacity:0;filter:blur(8px);transition:opacity .6s ease .25s, filter .6s ease .25s;
  }
  #desc.in{opacity:1;filter:blur(0)}
  .fadeable{transition:opacity .4s ease}
  .hidden-ui{opacity:0 !important;pointer-events:none !important}

  /* ---- prev / next thumbnails ---- */
  .thumb{
    position:fixed;top:50%;transform:translateY(-92px);z-index:25;
    width:56px;cursor:pointer;text-align:center;
    transition:opacity .4s ease, transform .25s ease;
  }
  .thumb:hover{transform:translateY(-94px)}
  #thumbPrev{left:80px} #thumbNext{right:80px}
  .thumb .box{
    width:56px;height:52px;border:1px solid rgba(58,47,33,.65);
    background:rgba(255,250,238,.25);
    display:flex;align-items:center;justify-content:center;
    box-shadow:2px 3px 6px rgba(70,50,25,.18);
  }
  .thumb .box svg{width:44px;height:34px}
  .thumb .cap{
    font-family:'Playfair Display',serif;font-size:11px;color:var(--ink);
    margin-top:-11px;background:transparent;letter-spacing:.02em;
  }

  /* ---- progress ---- */
  #progress{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:7px}
  #progress i{display:block;height:2px;width:14px;background:rgba(58,47,33,.25);transition:all .4s}
  #progress i.on{width:44px;background:rgba(58,47,33,.75)}

  /* ---- sound ---- */
  #sound{
    position:fixed;right:46px;bottom:52px;z-index:30;
    width:74px;height:74px;border-radius:50%;border:none;cursor:pointer;
    background:radial-gradient(circle at 34% 30%, #4c4238, #241f18 70%);
    box-shadow:4px 8px 20px rgba(50,35,18,.45), inset 0 1px 2px rgba(255,240,210,.18);
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s;
  }
  #sound:hover{transform:scale(1.05)}
  #sound svg{width:26px;height:26px;fill:#efe4cc}
  #sound .waves{transition:opacity .3s}
  #sound.muted .waves{opacity:.18}
</style>
</head>

  },

    desc:'Follow rail lines through white forests, tea steam, and villages stitched in lace wood.',
    layout:'rows', font:'"IBM Plex Mono",monospace', size:10.5, colGap:11.5, rowGap:15.5, curtainW:.82, curtainH:.52,
    text:'Дорога возникает под шагами идущего Не место красит человека а человек место Тише едешь — дальше будешь Язык до Киева доведёт В гостях хорошо а дома лучше Умный в гору не пойдёт умный гору обойдёт Глаза боятся а руки делают Кто ищет тот всегда найдёт Терпение и труд всё перетрут Своя земля и в горсти мила '

/* ================= view / strip ================= */
const stage = document.getElementById('stage');
const stripEl = document.getElementById('strip');
let VW = innerWidth, VH = innerHeight, DPR = Math.min(devicePixelRatio||1, 2);

let active = 2;                       // start on Japan
let overview = false;
const view = { cx: 0, s: 1, tcx: 0, ts: 1 };  // center-point in strip coords + scale
view.cx = view.tcx = active*VW + VW/2;

const panels = [];

function buildPanels(){
  stripEl.innerHTML = '';
  panels.length = 0;
  DESTS.forEach((d, i)=>{
    const p = document.createElement('section');
    p.className = 'panel';
    p.style.left = (i*VW)+'px';
    p.style.width = VW+'px';

    const roofW = Math.min(VW*0.44, 600) * (d.id==='china'||d.id==='kazakhstan' ? 1.05 : 1);
    const ratio = {['roof-japan']:170/440, ['roof-kazakhstan']:210/440, ['roof-china']:230/440,
                   ['roof-vietnam']:170/440, ['roof-russia']:190/440}[d.roof];
    // fraction of the SVG viewBox where the eave line (curtain anchor) sits
    const eaveFrac = {['roof-japan']:125/170, ['roof-kazakhstan']:186/210, ['roof-china']:187/230,
                   ['roof-vietnam']:112/170, ['roof-russia']:146/190}[d.roof];
    const roofH = roofW*ratio;
    const roofX = (VW-roofW)/2, roofY = VH*0.14;

    const shaft = document.createElement('div');
    shaft.className = 'lightshaft';
    shaft.style.cssText += `left:${roofX+roofW*0.55}px;top:${roofY+roofH*0.5}px;width:${roofW*0.9}px;height:${VH*0.62}px;`;
    p.appendChild(shaft);

    const cv = document.createElement('canvas');
    p.appendChild(cv);

    const rw = document.createElement('div');
    rw.className = 'roofwrap';
    rw.style.cssText = `left:${roofX}px;top:${roofY}px;width:${roofW}px;height:${roofH}px;`;
    rw.innerHTML = `<svg class="roof"><use href="#${d.roof}"/></svg>`;
    p.appendChild(rw);

    p.addEventListener('click', ()=>{ if(overview) selectFromOverview(i); });
    stripEl.appendChild(p);

    const panel = { el:p, cv, ctx:cv.getContext('2d'), dest:d,
      anchorX: VW/2, anchorY: roofY + roofH*eaveFrac + 2, roofW, particles:[] };
    sizeCanvas(panel);
    buildParticles(panel);
    panels.push(panel);
  });
  window.__panels = panels;   // debug/QA handle
}

function sizeCanvas(p){
  p.cv.width = VW*DPR; p.cv.height = VH*DPR;
  p.ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* ================= particles ================= */
function buildParticles(p){
  const d = p.dest, chars = [...d.text];
  const W = p.roofW * d.curtainW, H = VH * d.curtainH;
  const parts = [], chains = []; let ci = 0;
  const next = ()=>{ const c = chars[ci++ % chars.length]; return c; };
  const addChain = (col)=>{ if(col.length){ col[0].pinned = true; chains.push(col); parts.push(...col); } };

  if(d.layout === 'columns'){
    const nCols = Math.floor(W / d.colGap);
    for(let c=0;c<nCols;c++){
      const fx = c/(nCols-1);
      // ragged organic bottom edge
      const len = H * (0.42 + 0.58*Math.abs(Math.sin(c*1.7+2)) * (0.6+0.4*Math.sin(c*0.53)));
      const nRows = Math.max(6, Math.floor(len / d.rowGap));
      const colPhase = Math.sin(c*12.9898)*43758.5453 % (Math.PI*2);
      const col = [];
      for(let r=0;r<nRows;r++){
        const ch = next(); if(!ch || ch===' ') continue;
        col.push(mkPart(p, ch, (fx-0.5)*W + (Math.sin(c*7+r*3)*1.6), 10 + r*d.rowGap, r*d.rowGap/H, colPhase));
      }
      addChain(col);
    }
  } else {
    const nRows = Math.floor(H / d.rowGap);
    const nColsMax = Math.floor(W / d.colGap);
    const cols = Array.from({length:nColsMax}, ()=>[]);
    for(let r=0;r<nRows;r++){
      const rowPhase = Math.sin(r*78.233)*12345.678 % (Math.PI*2);
      for(let c=0;c<nColsMax;c++){
        const ch = next();
        if(ch===' ' || ch==='\n') continue;
        const fx = nColsMax>1 ? c/(nColsMax-1) : .5;
        cols[c].push(mkPart(p, ch, (fx-0.5)*W, 12 + r*d.rowGap, r*d.rowGap/H, rowPhase + c*0.11));
      }
    }
    cols.forEach(addChain);
  }
  p.particles = parts;
  p.chains = chains;   // each chain = one drooping strand, head stitched to the eave
}

function mkPart(p, ch, hx, hy, depth, phase){
  depth = Math.min(1, Math.max(0.04, depth));
  const x = p.anchorX + hx, y = p.anchorY + hy;
  return {
    ch, hx, hy, depth, phase, pinned:false,
    x, y, px:x, py:y,                // Verlet: velocity lives in (x - px)
    k: 0.008 - 0.0055*depth,         // very soft spring: words drift home, loose at the bottom
    alpha: 0.62 + Math.sin(phase*3+hx)*0.14 + 0.10*Math.random()
  };
}

/* ================= physics + render ================= */
const mouse = { x:-9999, y:-9999, sx:-9999, sy:-9999, px:-9999, py:-9999, vx:0, vy:0 };
addEventListener('pointermove', e=>{
  mouse.x = e.clientX; mouse.y = e.clientY;
  if(mouse.sx < -8000){ mouse.sx = mouse.px = mouse.x; mouse.sy = mouse.py = mouse.y; }  // first move: no fly-in, no velocity kick
});

let lastCx = view.cx;
let t = 0;

function frame(){
  t += 0.016;
  // ease view
  view.cx += (view.tcx - view.cx) * 0.075;
  view.s  += (view.ts  - view.s ) * 0.075;
  const wind = -(view.cx - lastCx); lastCx = view.cx;
  stripEl.style.transform = `translateX(${VW/2 - view.cx*view.s}px) scale(${view.s})`;

  // the field trails the cursor — latency is what reads as weight
  mouse.sx += (mouse.x - mouse.sx) * 0.09;
  mouse.sy += (mouse.y - mouse.sy) * 0.09;
  mouse.vx = mouse.sx - mouse.px; mouse.vy = mouse.sy - mouse.py;
  mouse.px = mouse.sx; mouse.py = mouse.sy;

  for(const p of panels){
    const rect = p.el.getBoundingClientRect();
    if(rect.right < -60 || rect.left > VW+60){ continue; }   // offscreen: skip
    stepPanel(p, rect, wind);
  }
  requestAnimationFrame(frame);
}

function stepPanel(p, rect, wind){
  const ctx = p.ctx, d = p.dest;
  ctx.clearRect(0,0,VW,VH);
  // mouse in panel-local (unscaled) coords
  const sc = rect.width / VW;
  const mx = (mouse.sx - rect.left)/sc, my = (mouse.sy - rect.top)/sc;
  const mvx = mouse.vx/sc, mvy = mouse.vy/sc;
  const R = 165, R2 = R*R;

  // --- physics: Verlet integration, strand heads hinged to the eave ---
  for(const q of p.particles){
    if(q.pinned){
      // the head can shimmy a little, but never leaves the eave
      const hx0 = p.anchorX + q.hx, hy0 = p.anchorY + q.hy;
      let ax = (hx0 + Math.sin(t*1.15 + q.phase)*2.2 - q.x) * 0.20;
      let ay = (hy0 - q.y) * 0.55;
      const hdx = q.x - mx, hdy = q.y - my, hd2 = hdx*hdx + hdy*hdy;
      if(hd2 < R2 && hd2 > 0.01){
        const hdist = Math.sqrt(hd2), hf = 1 - hdist/R;
        ax += (hdx/hdist) * hf*hf * 0.65;      // visible cursor nudge, still rooted
      }
      const hvx = (q.x - q.px) * 0.72 + ax;
      const hvy = (q.y - q.py) * 0.72 + ay;
      q.px = q.x; q.py = q.y;
      q.x += hvx; q.y += hvy;
      q.x = Math.max(hx0 - 7, Math.min(hx0 + 7, q.x));   // hard clamp: stitched on
      q.y = Math.max(hy0 - 1.5, Math.min(hy0 + 1.5, q.y));
      continue;
    }
    const sway =
      Math.sin(t*1.15 + q.hy*0.011 + q.phase) * 9 * q.depth +
      Math.sin(t*0.42 + q.phase*1.7) * 17 * q.depth*q.depth;
    const tx = p.anchorX + q.hx + sway;
    const ty = p.anchorY + q.hy + Math.sin(t*0.8 + q.phase)*2.2*q.depth;

    const breeze = Math.max(-30, Math.min(30, wind));  // cap the slide's initial burst
    let ax = breeze * 0.008 * (0.3 + q.depth), ay = 0; // mild drift on slide, not a yank
    const dx = q.x - mx, dy = q.y - my, d2 = dx*dx + dy*dy;
    if(d2 < R2 && d2 > 0.01){
      const dist = Math.sqrt(d2), f = (1 - dist/R);
      // looseness ramps toward the free end of the strand — gently, so tails don't whip
      const loose = 0.12 + 0.42 * q.depth;
      // combing: the cursor mostly DRAGS strands along its path; the radial push is secondary
      // drag velocity is capped so fast swipes comb instead of slingshotting the tails
      const cvx = Math.max(-16, Math.min(16, mvx)), cvy = Math.max(-16, Math.min(16, mvy));
      const push = f*f * 0.9 * loose;
      ax += (dx/dist)*push + cvx * f * 0.75 * loose;
      ay += (dy/dist)*push*0.7 + cvy * f * 0.75 * loose;
    }
    // nonlinear spring: far-displaced words start home slowly (weight), full hold near rest (sway)
    const ddx = tx - q.x, ddy = ty - q.y;
    const soft = 1 / (1 + (Math.abs(ddx) + Math.abs(ddy)) * 0.032);   // combed shapes linger
    ax += ddx * q.k * soft;
    ay += ddy * q.k * soft;

    const damp = 0.80;                      // uniform heavy damping: no rubbery tail momentum
    const nvx = (q.x - q.px) * damp + ax;   // heavy damping: settle, never bounce
    const nvy = (q.y - q.py) * damp + ay;
    q.px = q.x; q.py = q.y;
    q.x += nvx; q.y += nvy;
  }

  // --- bend smoothing first: kinks relax into the smooth combed curves of the reference ---
  for(const chain of p.chains){
    for(let i=1; i<chain.length-1; i++){
      const q = chain[i];
      if(q.pinned) continue;
      const a = chain[i-1], b = chain[i+1];
      q.x += ((a.x + b.x)/2 - q.x) * 0.10;
      q.y += ((a.y + b.y)/2 - q.y) * 0.10;
    }
  }
  // --- strand integrity LAST, so the limits hold exactly: bend and bunch, never break ---
  for(let iter=0; iter<3; iter++){
    for(const chain of p.chains){
      for(let i=1; i<chain.length; i++){
        const a = chain[i-1], b = chain[i];
        const maxL = (b.hy - a.hy) * 1.26 + 3;  // firm slack, then inextensible
        const lx = b.x - a.x, ly = b.y - a.y;
        const dist = Math.hypot(lx, ly) || 1e-4;
        if(dist > maxL){
          const diff = (dist - maxL) / dist;
          if(a.pinned){ b.x -= lx*diff; b.y -= ly*diff; }
          else {
            a.x += lx*diff*0.5; a.y += ly*diff*0.5;
            b.x -= lx*diff*0.5; b.y -= ly*diff*0.5;
          }
        }
      }
    }
  }

  // --- draw: shadow pass, then ink pass ---
  ctx.font = `${d.size}px ${d.font}`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(90,66,35,0.055)';
  for(const q of p.particles){
    ctx.fillText(q.ch, q.x + 9 + 14*q.depth, q.y + 5 + 6*q.depth);
  }
  for(const q of p.particles){
    ctx.fillStyle = `rgba(64,50,32,${q.alpha})`;
    ctx.fillText(q.ch, q.x, q.y);
  }
}

/* ================= UI: copy / thumbs / progress ================= */
const kickerEl = document.getElementById('kicker');
const titleEl  = document.getElementById('title');
const descEl   = document.getElementById('desc');
const thumbPrev = document.getElementById('thumbPrev');
const thumbNext = document.getElementById('thumbNext');
const progress  = document.getElementById('progress');

function renderCopy(i){
  const d = DESTS[i];
  kickerEl.classList.remove('in'); descEl.classList.remove('in');
  kickerEl.innerHTML = `<b>${d.kicker[0]}</b> ${d.kicker[1]} ${d.kicker[2]}`;
  titleEl.innerHTML = d.title.split(' ').map(w=>`<span class="w">${w}</span>`).join(' ');
  descEl.textContent = d.desc;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    kickerEl.classList.add('in'); descEl.classList.add('in');
    titleEl.querySelectorAll('.w').forEach((w,j)=>{
      w.style.transitionDelay = (0.12 + j*0.05)+'s';
      w.classList.add('in');
    });
  }));

  const prev = i-1, next = i+1;
  thumbPrev.classList.toggle('hidden-ui', prev<0 || overview);
  thumbNext.classList.toggle('hidden-ui', next>=DESTS.length || overview);
  if(prev>=0){ document.getElementById('thumbPrevUse').setAttribute('href','#'+DESTS[prev].roof);
               document.getElementById('thumbPrevCap').textContent = DESTS[prev].name; }
  if(next<DESTS.length){ document.getElementById('thumbNextUse').setAttribute('href','#'+DESTS[next].roof);
               document.getElementById('thumbNextCap').textContent = DESTS[next].name; }

  progress.innerHTML = DESTS.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('');
}

function go(i){
  if(i<0 || i>=DESTS.length) return;
  active = i;
  view.tcx = i*VW + VW/2;
  renderCopy(i);
}
thumbPrev.addEventListener('click', ()=>go(active-1));
thumbNext.addEventListener('click', ()=>go(active+1));
addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') go(active-1);
  if(e.key==='ArrowRight') go(active+1);
});

/* ================= nav / overview ================= */
const navlinks = document.querySelectorAll('.navlink');
function setNav(id){ navlinks.forEach(n=>n.classList.toggle('on', n.dataset.nav===id)); }

function enterOverview(){
  overview = true;
  stage.classList.add('overview');
  view.ts = 0.42;
  view.tcx = active*VW + VW/2;
  document.getElementById('copy').classList.add('hidden-ui');
  descEl.classList.add('hidden-ui');
  thumbPrev.classList.add('hidden-ui');
  thumbNext.classList.add('hidden-ui');
  setNav('destinations');
}
function exitOverview(toIndex){
  overview = false;
  stage.classList.remove('overview');
  view.ts = 1;
  document.getElementById('copy').classList.remove('hidden-ui');
  descEl.classList.remove('hidden-ui');
  setNav('home');
  go(toIndex ?? active);
}
function selectFromOverview(i){ exitOverview(i); }

navlinks.forEach(n=>n.addEventListener('click', ()=>{
  if(n.dataset.nav==='home') exitOverview();
  if(n.dataset.nav==='destinations') enterOverview();
}));

/* ================= sound (soft steppe wind) ================= */
const soundBtn = document.getElementById('sound');
let audioCtx=null, windGain=null;
soundBtn.addEventListener('click', ()=>{
  const muted = soundBtn.classList.toggle('muted');
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const len = audioCtx.sampleRate*2;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const ch = buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+0.02*w)/1.02; ch[i]=last*3.2; }
    const src = audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
    const filt = audioCtx.createBiquadFilter(); filt.type='lowpass'; filt.frequency.value=420; filt.Q.value=0.6;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value=0.09;
    const lfoG = audioCtx.createGain(); lfoG.gain.value=180;
    lfo.connect(lfoG); lfoG.connect(filt.frequency); lfo.start();
    windGain = audioCtx.createGain(); windGain.gain.value=0;
    src.connect(filt); filt.connect(windGain); windGain.connect(audioCtx.destination);
    src.start();
  }
  audioCtx.resume();
  windGain.gain.linearRampToValueAtTime(muted?0:0.10, audioCtx.currentTime+0.8);
});

/* ================= boot / resize ================= */
function boot(){
  VW = innerWidth; VH = innerHeight;
  buildPanels();
  view.cx = view.tcx = active*VW + VW/2;
  lastCx = view.cx;
  renderCopy(active);
}
let rto=null;
addEventListener('resize', ()=>{ clearTimeout(rto); rto=setTimeout(boot, 200); });
boot();
requestAnimationFrame(frame);
</script>
